<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta para Padres de Familia</title>
    <!-- 
      AQUÍ SE CARGA EL "CSS" (Tailwind)
      Esto le da todo el diseño profesional y responsivo.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Usamos la fuente "Inter" que es limpia y moderna */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Pequeña mejora para los botones de radio y checkboxes */
        input[type="radio"], input[type="checkbox"] {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- ESTO ES EL "HTML" (La estructura) -->
    <div class="container max-w-3xl mx-auto p-4 sm:p-8 my-10">
        
        <div class="bg-white p-6 sm:p-10 rounded-xl shadow-xl">

            <!-- 1. Encabezado -->
            <header class="border-b border-gray-200 pb-6 mb-8">
                <div class="flex items-center space-x-4">
                    <!-- Puedes reemplazar esto con la URL del logo del colegio -->
                    <img src="https://placehold.co/80x80/0d47a1/ffffff?text=LOGO" alt="Logo del Colegio" class="h-16 w-16 sm:h-20 sm:w-20 rounded-full object-cover">
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Encuesta para Padres de Familia</h1>
                        <p class="text-gray-600 mt-1">Su opinión es fundamental para mejorar.</p>
                    </div>
                </div>
            </header>

            <!-- 2. Formulario de Encuesta (HTML) -->
            <form id="surveyForm">
                
                <!-- Sección 1: Información Básica -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-gray-700 mb-4">Información del Estudiante</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="studentGrade" class="block text-sm font-medium text-gray-700 mb-1">Grado del estudiante:</label>
                            <select id="studentGrade" name="studentGrade" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                                <option value="" disabled selected>Seleccione un grado</option>
                                <option value="inicial_3">Inicial (3 años)</option>
                                <option value="inicial_4">Inicial (4 años)</option>
                                <option value="inicial_5">Inicial (5 años)</option>
                                <option value="primaria_1">1º Primaria</option>
                                <option value="primaria_2">2º Primaria</option>
                                <option value="primaria_3">3º Primaria</option>
                                <option value="primaria_4">4º Primaria</option>
                                <option value="primaria_5">5º Primaria</option>
                                <option value="primaria_6">6º Primaria</option>
                                <option value="secundaria_1">1º Secundaria</option>
                                <option value="secundaria_2">2º Secundaria</option>
                                <option value="secundaria_3">3º Secundaria</option>
                                <option value="secundaria_4">4º Secundaria</option>
                                <option value="secundaria_5">5º Secundaria</option>
                            </select>
                        </div>
                        <div>
                            <label for="studentExperience" class="block text-sm font-medium text-gray-700 mb-1">¿Cuántos años lleva su hijo/a en el colegio?</label>
                            <select id="studentExperience" name="studentExperience" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                                <option value="" disabled selected>Seleccione una opción</option>
                                <option value="nuevo">Es su primer año</option>
                                <option value="2-3">2 a 3 años</option>
                                <option value="4-5">4 a 5 años</option>
                                <option value="mas_5">Más de 5 años</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Sección 2: Calidad Académica -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-gray-700 mb-4">Calidad Académica</h2>
                    
                    <label class="block text-sm font-medium text-gray-700 mb-2">¿Cómo calificaría el nivel de satisfacción con la calidad de la enseñanza?</label>
                    <div class="space-y-2">
                        <!-- Opciones de respuesta (Radio) -->
                        <div class="flex items-center">
                            <input id="calidad_5" name="calidadAcademica" type="radio" value="5" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500" required>
                            <label for="calidad_5" class="ml-3 block text-sm text-gray-700">Muy Satisfecho</label>
                        </div>
                        <div class="flex items-center">
                            <input id="calidad_4" name="calidadAcademica" type="radio" value="4" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                            <label for="calidad_4" class="ml-3 block text-sm text-gray-700">Satisfecho</label>
                        </div>
                        <div class="flex items-center">
                            <input id="calidad_3" name="calidadAcademica" type="radio" value="3" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                            <label for="calidad_3" class="ml-3 block text-sm text-gray-700">Neutral</label>
                        </div>
                        <div class="flex items-center">
                            <input id="calidad_2" name="calidadAcademica" type="radio" value="2" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                            <label for="calidad_2" class="ml-3 block text-sm text-gray-700">Insatisfecho</label>
                        </div>
                        <div class="flex items-center">
                            <input id="calidad_1" name="calidadAcademica" type="radio" value="1" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                            <label for="calidad_1" class="ml-3 block text-sm text-gray-700">Muy Insatisfecho</label>
                        </div>
                    </div>
                </div>

                <!-- Sección 3: Comunicación -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-gray-700 mb-4">Comunicación Colegio-Padres</h2>
                    
                    <label class="block text-sm font-medium text-gray-700 mb-2">¿Qué canales de comunicación utiliza MÁS FRECUENTEMENTE? (Marque todos los que apliquen)</label>
                    <div class="space-y-2" id="canalesComunicacion">
                        <!-- Opciones de respuesta (Checkbox) -->
                        <div class="flex items-center">
                            <input id="canal_email" name="canal_email" type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <label for="canal_email" class="ml-3 block text-sm text-gray-700">Correo Electrónico</label>
                        </div>
                        <div class="flex items-center">
                            <input id="canal_plataforma" name="canal_plataforma" type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <label for="canal_plataforma" class="ml-3 block text-sm text-gray-700">Plataforma/Intranet del Colegio</slabel>
                        </div>
                        <div class="flex items-center">
                            <input id="canal_whatsapp" name="canal_whatsapp" type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <label for="canal_whatsapp" class="ml-3 block text-sm text-gray-700">Grupos de WhatsApp</label>
                        </div>
                        <div class="flex items-center">
                            <input id="canal_reuniones" name="canal_reuniones" type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <label for="canal_reuniones" class="ml-3 block text-sm text-gray-700">Reuniones presenciales/virtuales</label>
                        </div>
                        <div class="flex items-center">
                            <input id="canal_web" name="canal_web" type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <label for="canal_web" class="ml-3 block text-sm text-gray-700">Página Web del Colegio</slabel>
                        </div>
                    </div>
                </div>

                <!-- Sección 4: Comentarios Abiertos -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-gray-700 mb-4">Comentarios Adicionales</h2>
                    
                    <div>
                        <label for="sugerencias" class="block text-sm font-medium text-gray-700 mb-1">¿Qué sugerencias tiene para mejorar el colegio?</label>
                        <textarea id="sugerencias" name="sugerencias" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                    </div>

                    <div class="mt-6">
                        <label for="aspectos_positivos" class="block text-sm font-medium text-gray-700 mb-1">¿Qué aspectos positivos del colegio le gustaría destacar?</label>
                        <textarea id="aspectos_positivos" name="aspectos_positivos" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                    </div>
                </div>

                <!-- Botón de Envío -->
                <div class="mt-10 pt-6 border-t border-gray-200">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors duration-300 text-lg">
                        Enviar Encuesta
                    </button>
                </div>

            </form>

            <!-- 3. Mensaje de Éxito (Oculto por defecto) (HTML) -->
            <div id="successMessage" class="hidden text-center p-8">
                <div class="flex justify-center mb-4">
                    <!-- Un ícono de check simple con SVG -->
                    <svg class="h-16 w-16 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">¡Encuesta Enviada!</h2>
                <p class="text-gray-600 text-lg">Muchas gracias por su tiempo y sus valiosos comentarios. Su opinión nos ayuda a crecer.</p>
            </div>

        </div>
    </div>

    <!-- 
      ESTO ES EL "JAVASCRIPT" (La interactividad)
      Este código se ejecuta cuando el usuario presiona "Enviar".
      Por ahora, solo oculta el formulario y muestra el mensaje de "Gracias".
    -->
    <script>
        document.getElementById('surveyForm').addEventListener('submit', function(event) {
            // Prevenimos que la página se recargue
            event.preventDefault();

            // Ocultamos el formulario
            const form = document.getElementById('surveyForm');
            form.style.display = 'none';

            // Mostramos el mensaje de agradecimiento
            const successMsg = document.getElementById('successMessage');
            successMsg.classList.remove('hidden');

            // Opcional: Llevamos al usuario al inicio de la página para ver el mensaje
            window.scrollTo(0, 0);
        });
    </script>

</body>
</html>
